name: Andex
options:
  bundleIdPrefix: com.android
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Configuration/Debug.xcconfig
  Release: Configuration/Release.xcconfig
projectReferences:
  libarchive:
    path: ../third_party/ish-arm64/deps/libarchive.xcodeproj
packages:
  PostHog:
    url: https://github.com/PostHog/posthog-ios.git
    exactVersion: 3.71.4
  Runestone:
    url: https://github.com/simonbs/Runestone.git
    exactVersion: 0.5.2
targets:
  Andex:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
      - path: Runtime
      - path: ../third_party/ish-arm64/tools/fakefs.c
        group: iSH Runtime
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Resources/Runtime/bridge.mjs
      - path: Resources/Runtime/extension-bridge.mjs
        buildPhase: resources
      - path: Resources/Runtime/image-resize-worker.js
        buildPhase: resources
      - path: Resources/Runtime/photon_rs_bg.wasm
        buildPhase: resources
      - path: Resources/Runtime/root.tar.gz
        buildPhase: resources
      - path: Resources/Runtime/extensions
        type: folder
        buildPhase: resources
      - path: ../third_party/ish-arm64/app/RootfsPatch.bundle/files/lib/wasm-polyfill.js
        group: Resources
        buildPhase: resources
      - path: ../third_party/ish-arm64/app/RootfsPatch.bundle/files/lib/fetch-polyfill.js
        group: Resources
        buildPhase: resources
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: ../THIRD_PARTY_NOTICES.md
        group: Licenses
        buildPhase: resources
      - path: ../LICENSE
        group: Licenses
        buildPhase: resources
      - path: ../third_party/ish-arm64/LICENSE.md
        group: Licenses
        buildPhase: resources
      - path: ../third_party/ish-arm64/LICENSE.IOS
        group: Licenses
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        BGTaskSchedulerPermittedIdentifiers:
          - $(PRODUCT_BUNDLE_IDENTIFIER).agent.*
        UIBackgroundModes:
          - processing
        CADisableMinimumFrameDurationOnPhone: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Andex accesses local network services only when you connect a self-hosted AI provider.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UILaunchScreen: {}
    dependencies:
      - target: AndexFileProvider
      - target: libarchive/libarchive
      - package: Runestone
      - package: PostHog
      - sdk: SystemConfiguration.framework
      - sdk: libbz2.tbd
      - sdk: libiconv.tbd
      - sdk: libresolv.tbd
      - sdk: libsqlite3.tbd
    preBuildScripts:
      - name: Prepare Alpine and Pi Bridge
        script: |
          "$SRCROOT/../scripts/prepare-ios-runtime.sh" "$SRCROOT/Resources/Runtime"
        basedOnDependencyAnalysis: false
      - name: Build AndexShared
        script: |
          set -e
          cd "$SRCROOT/.."
          bash ./gradlew -Pandex.sharedOnly=true :shared:embedAndSignAppleFrameworkForXcode :shared:generateIosPostHogConfig
          mkdir -p "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          cp shared/build/generated/posthog/PostHogConfig.json "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/PostHogConfig.json"
        basedOnDependencyAnalysis: false
      - name: Build iSH ARM64 Runtime
        script: |
          "$SRCROOT/../scripts/build-ios-ish-runtime.sh"
        basedOnDependencyAnalysis: false
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Andex.entitlements
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
        CLANG_ENABLE_MODULES: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        ONLY_ACTIVE_ARCH: YES
  AndexFileProvider:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FileProvider
    info:
      path: FileProvider/Info.plist
      properties:
        CFBundleDisplayName: Andex File Provider
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionFileProviderDocumentGroup: group.com.android.andex
          NSExtensionFileProviderSupportsEnumeration: true
          NSExtensionFileProviderAppliesChangesAtomically: true
          NSExtensionFileProviderDownloadPipelineDepth: 2
          NSExtensionPointIdentifier: com.apple.fileprovider-nonui
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FileProviderExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.android.andex.fileprovider
        PRODUCT_NAME: AndexFileProvider
        PRODUCT_MODULE_NAME: AndexFileProvider
        CODE_SIGN_ENTITLEMENTS: Andex.entitlements
        CODE_SIGN_STYLE: Automatic
        OTHER_LDFLAGS: ""
    dependencies:
      - sdk: libsqlite3.tbd
  AndexRuntimeTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/Runtime
    dependencies:
      - target: Andex
    settings:
      base:
        PRODUCT_NAME: AndexRuntimeTests
        PRODUCT_MODULE_NAME: AndexRuntimeTests
        PRODUCT_BUNDLE_IDENTIFIER: com.android.andex.runtime-tests
        CODE_SIGN_STYLE: Automatic
        SWIFT_OBJC_BRIDGING_HEADER: ""
        OTHER_LDFLAGS: -framework AndexShared
        GENERATE_INFOPLIST_FILE: YES
  AndexFileProviderTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/FileProvider
      - path: FileProvider/FakeFSStore.swift
    dependencies:
      - sdk: libsqlite3.tbd
    settings:
      base:
        PRODUCT_NAME: AndexFileProviderTests
        PRODUCT_MODULE_NAME: AndexFileProviderTests
        PRODUCT_BUNDLE_IDENTIFIER: com.android.andex.fileprovider-tests
        CODE_SIGN_STYLE: Automatic
        OTHER_LDFLAGS: ""
        GENERATE_INFOPLIST_FILE: YES
  AndexUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/UI
    dependencies:
      - target: Andex
    settings:
      base:
        PRODUCT_NAME: AndexUITests
        PRODUCT_MODULE_NAME: AndexUITests
        PRODUCT_BUNDLE_IDENTIFIER: com.android.andex.ui-tests
        CODE_SIGN_STYLE: Automatic
        SWIFT_OBJC_BRIDGING_HEADER: ""
        OTHER_LDFLAGS: ""
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Andex:
    build:
      targets:
        Andex: all
        AndexFileProvider: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AndexFileProviderTests
        - AndexRuntimeTests
        - AndexUITests
    archive:
      config: Release
